<h1 class=sr-only>Marble Roulette™ 마블 룰렛™ - 랜덤 추첨기</h1>
<div id=settings class=settings>
  <div class=right>
    <button id=btnToggleSettings class=btn-toggle-settings>
      <span data-trans>Settings</span>
      <i class=toggle-arrow>▲</i>
    </button>
    <div class="collapsed collapsible-rows">
      <div class=row>
        <label for=sltMap>
          <i class="icon map"></i>
          <span data-trans>Map</span>
        </label>
        <select id=sltMap></select>
        <button type=button id=btnOpenEditor class=btn style="white-space:nowrap;background:#00838f;margin-left:6px;padding:4px 8px;font-size:11px" title="맵 에디터 열기">🛠️ 에디터</button>
      </div>
      <div class="row row-toggles">
        <div class=toggle-item>
          <label for=chkAutoRecording>
            <i class="icon record"></i>
            <span data-trans>Recording</span>
          </label>
          <input type=checkbox id=chkAutoRecording>
        </div>
        <div class=toggle-item>
          <label for=chkSkill>
            <i class="bomb icon"></i>
            <span data-trans>Using skills</span>
          </label>
          <input type=checkbox id=chkSkill checked>
        </div>
      </div>
      <div class=row>
        <label>
          <i class="icon trophy"></i>
          <span data-trans>The winner is</span>
        </label>
        <div class=btn-group>
          <button class="active btn-first-winner btn-winner" data-trans>First</button>
          <button class="btn-last-winner btn-winner" data-trans>Last</button>
          <input type=number id=in_winningRank value=1 min=1>
          <button class="btn-multi-winner btn-winner" data-trans>Multiple</button>
        </div>
      </div>
      <div class="row row-range">
        <label></label>
        <div class="btn-group range-group">
          <input type=number id=in_rangeStart value=1 min=1>
          <span class=range-sep>~</span>
          <input type=number id=in_rangeEnd value=3 min=1>
        </div>
      </div>
      <div class="row row-theme">
        <div class=theme>
          <i class="icon sun"></i>
          <input type=checkbox id=chkDarkMode checked>
          <i class="icon moon"></i>
        </div>
      </div>
    </div>
  </div>
  <div class=left>
    <div class=names-header>
      <h3 data-trans>Enter names below</h3>
      <div class=preset-controls>
        <select id=sltPreset title="추천 및 저장된 명단 프리셋 선택">
          <option value>-- 프리셋 선택 --</option>
        </select>
        <button type=button id=btnSavePreset class=btn-sm title="현재 명단을 새 프리셋으로 저장">저장</button>
        <button type=button id=btnDeletePreset class="btn-del btn-sm" title="선택한 사용자 프리셋 삭제">삭제</button>
      </div>
    </div>
    <textarea id=in_names placeholder="Input names separated by commas or line feed here" data-trans=placeholder>수박*2,키위*2,귤*2</textarea>
    <div class=actions>
      <button id=btnShuffle>
        <i class="icon shuffle"></i>
        <span data-trans>Shuffle</span>
      </button>
      <button id=btnStart>
        <i class="icon play"></i>
        <span data-trans>Start</span>
      </button>
    </div>
  </div>
</div>
<div class=copyright>© 2022-2026. 마블 룰렛™ by <a href=https://lazygyu.net target=_blank>lazygyu</a> (modified by eljja)
</div>
<div id=mapEditorOverlay class="hide map-editor-overlay"></div>
<div id=resultModal class="hide result-modal">
  <div class=result-modal-content>
    <div class=result-modal-header>
      <h3 id=resultTitle>🏆 추첨 결과</h3>
      <button type=button id=btnCloseResultModal class=btn-close title=닫기>×</button>
    </div>
    <div id=resultList class=result-modal-body></div>
    <div class=result-modal-actions>
      <button type=button id=btnCopyResult class=btn-copy>📋 결과 텍스트 복사</button>
      <button type=button id=btnNextRoundExclude class=btn-exclude>⏭️ 당첨자 제외하고 다음 판 (서바이벌)</button>
      <button type=button id=btnRestartSame class=btn-restart>🔄 같은 명단으로 다시 준비</button>
    </div>
  </div>
</div>
